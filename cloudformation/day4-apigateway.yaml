AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IVR Workshop - Day 4: API Gateway REST API.
  Creates the /tools/* REST API with 8 POST endpoints backed by your Lambda functions.
  Deploy on Day 4 at the start of the API Gateway lab.
  PREREQUISITE: day3-lambda.yaml stack must be CREATE_COMPLETE.

# ============================================================
# DEPLOY COMMAND
#   aws cloudformation deploy \
#     --template-file day4-apigateway.yaml \
#     --stack-name nmc-YOURNAME-day4 \
#     --parameter-overrides ParticipantName=YOURNAME \
#     --region YOUR_REGION
#
# Replace YOURNAME with the SAME name you used on Day 1 and Day 3.
# Replace YOUR_REGION with your AWS region (e.g., us-east-1, us-west-2, ap-south-1)
# ============================================================

Parameters:

  ParticipantName:
    Type: String
    Description: >
      Your participant name — must be EXACTLY the same as Day 1 and Day 3.
    AllowedPattern: ^[a-z][a-z0-9-]{1,18}[a-z0-9]$

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Who Are You? (must match Day 1 and Day 3)" }
        Parameters: [ParticipantName]

Resources:

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'nmc-${ParticipantName}-apigw-cw-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn: ApiGatewayCloudWatchRole
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'nmc-${ParticipantName}-api'
      Description: !Sub 'IVR Workshop API for participant ${ParticipantName}'
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName
        - Key: Workshop
          Value: ivr-workshop

  ToolsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: tools

  # ---- verify-identity ----

  VerifyIdentityResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ToolsResource
      PathPart: verify-identity

  VerifyIdentityPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref VerifyIdentityResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:nmc-${ParticipantName}-verify-identity/invocations'

  VerifyIdentityOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref VerifyIdentityResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false

  VerifyIdentityPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:nmc-${ParticipantName}-verify-identity'
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/tools/verify-identity'

  # ---- check-available-slots ----

  CheckAvailableSlotsResource:
