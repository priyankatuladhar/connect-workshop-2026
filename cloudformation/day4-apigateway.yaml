  # ============================================================
  # DEPLOYMENT + STAGE
  # ============================================================

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - VerifyIdentityPost
      - CheckAvailableSlotsPost
      - BookAppointmentPost
      - RescheduleAppointmentPost
      - CancelAppointmentPost
      - LookupAppointmentPost
      - RequestPrescriptionRefillPost
      - LogCallResultPost
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    DependsOn: ApiGatewayAccount
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/nmc-${ParticipantName}/access'
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","resource":"$context.resourcePath","status":"$context.status","latency":"$context.integrationLatency"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: ApiStage
    Properties:
      Name: !Sub 'nmc-${ParticipantName}-api-key'
      Enabled: true
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub 'nmc-${ParticipantName}-usage-plan'
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: prod
      Throttle:
        RateLimit: 10
        BurstLimit: 20
      Quota:
        Limit: 1000
        Period: DAY
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  ApiEndpoint:
    Description: Your API endpoint — use this in AgentCore Gateway
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  RestApiId:
    Value: !Ref RestApi

  ApiKeyId:
    Description: API key ID (not the value — get the value from day5-data.yaml outputs)
    Value: !Ref ApiKey

  ParticipantApiEndpoint:
    Description: Full curl test command — replace YOUR_API_KEY after running day5-data.yaml
    Value: !Sub 'curl -X POST https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/tools/verify-identity -H "x-api-key: YOUR_API_KEY" -H "Content-Type: application/json" -d "{\"phoneNumber\":\"+16505551001\",\"dateOfBirth\":\"1985-03-15\"}"'
