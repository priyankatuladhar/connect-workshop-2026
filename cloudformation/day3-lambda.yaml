  LogGroupLogCallResult:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/nmc-${ParticipantName}-log-call-result'
      RetentionInDays: !Ref LogRetentionDays
