  VerifyIdentityFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupVerifyIdentity
    Properties:
      FunctionName: !Sub 'nmc-${ParticipantName}-verify-identity'
      Description: !Sub 'Participant ${ParticipantName}: verifies caller identity via phone + DOB'
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/nmc-${ParticipantName}-lambda-exec-role'
      Timeout: 30
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          PATIENTS_TABLE_NAME: !Sub 'nmc-${ParticipantName}-patients'
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              return {
                  'statusCode': 501,
                  'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
                  'body': json.dumps({'error': 'Not Implemented', 'message': 'Upload real handler code'})
              }
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName

