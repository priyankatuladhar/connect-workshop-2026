AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IVR Workshop - Day 3: Lambda Functions + CloudWatch Log Groups.
  Creates all 12 Lambda functions and their pre-CMK-encrypted log groups.
  Deploy this on Day 3 BEFORE starting the AgentCore Gateway lab.
  PREREQUISITE: day1-foundation.yaml stack must be CREATE_COMPLETE.

# ============================================================
# DEPLOY COMMAND
#   aws cloudformation deploy \
#     --template-file day3-lambda.yaml \
#     --stack-name nmc-YOURNAME-day3 \
#     --parameter-overrides ParticipantName=YOURNAME KmsKeyArn=YOUR_REGION_KMS_KEY_ARN \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --region YOUR_REGION
#
# Replace YOURNAME with the SAME name you used on Day 1.
# Replace YOUR_REGION with your AWS region (e.g., us-east-1, us-west-2, ap-south-1)
# Replace YOUR_REGION_KMS_KEY_ARN with the KMS key ARN for your region
#   Example: arn:aws:kms:us-east-1:123456789012:key/abc-123-def
# ============================================================

Parameters:

  ParticipantName:
    Type: String
    Description: >
      Your participant name — must be EXACTLY the same as what you used in day1-foundation.yaml.
      This is used to find your Day 1 resources (tables, roles, etc.)
    AllowedPattern: ^[a-z][a-z0-9-]{1,18}[a-z0-9]$

  KmsKeyArn:
    Type: String
    Description: >
      KMS key ARN for your region (REQUIRED). Must be in the same region as your deployment.
      Your instructor will provide this, or use your own account KMS key.
      Example: arn:aws:kms:us-east-1:123456789012:key/abc-123-def
    AllowedPattern: ^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/.+$
    ConstraintDescription: Must be a valid KMS key ARN in the format arn:aws:kms:REGION:ACCOUNT:key/KEY_ID

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Who Are You? (must match Day 1)" }
        Parameters: [ParticipantName]
      - Label: { default: "Region-Specific Settings (REQUIRED)" }
        Parameters: [KmsKeyArn, LogRetentionDays]

Resources:

  # ============================================================
  # CLOUDWATCH LOG GROUPS — pre-created with CMK encryption
  # Must exist BEFORE Lambda functions or they auto-create without CMK
  # ============================================================

  LogGroupVerifyIdentity:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/nmc-${ParticipantName}-verify-identity'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn

  LogGroupCheckAvailableSlots:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/nmc-${ParticipantName}-check-available-slots'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn

  LogGroupBookAppointment:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/nmc-${ParticipantName}-book-appointment'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn

  LogGroupRescheduleAppointment:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/nmc-${ParticipantName}-reschedule-appointment'
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !Ref KmsKeyArn

  LogGroupCancelAppointment:
    Type: AWS::Logs::LogGroup
