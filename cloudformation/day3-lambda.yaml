  SampleDataSeederFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupSampleDataSeeder
    Properties:
      FunctionName: !Sub 'nmc-${ParticipantName}-sample-data-seeder'
      Description: !Sub 'Participant ${ParticipantName}: one-shot CFN custom resource seeder'
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/nmc-${ParticipantName}-seeder-role'
      Timeout: 120
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  table_name = event['ResourceProperties']['TableName']
                  raw = event['ResourceProperties'].get('SampleData', '[]')
                  sample_data = json.loads(raw)
                  dynamodb = boto3.resource('dynamodb')
                  ddb_client = boto3.client('dynamodb')
                  table = dynamodb.Table(table_name)
                  key_attrs = set()
                  try:
                      desc = ddb_client.describe_table(TableName=table_name)['Table']
                      for k in desc.get('KeySchema', []):
                          key_attrs.add(k['AttributeName'])
                      for gsi in desc.get('GlobalSecondaryIndexes', []) or []:
                          for k in gsi.get('KeySchema', []):
                              key_attrs.add(k['AttributeName'])
                  except Exception as e:
                      print(f'describe_table error: {e}')
                  seeded, skipped = 0, 0
                  for item in sample_data:
                      item = {k: v for k, v in item.items() if v is not None and v != ''}
                      missing = [k for k in key_attrs if k not in item]
                      if missing:
                          skipped += 1
                          continue
                      table.put_item(Item=item)
                      seeded += 1
                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {'ItemsSeeded': seeded, 'ItemsSkipped': skipped})
              except Exception as e:
                  print(f'Seeder error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName

  ApiKeyRetrievalFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroupApiKeyRetrieval
    Properties:
      FunctionName: !Sub 'nmc-${ParticipantName}-api-key-retrieval'
      Description: !Sub 'Participant ${ParticipantName}: CFN custom resource to get API key plaintext'
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !Sub 'arn:aws:iam::${AWS::AccountId}:role/nmc-${ParticipantName}-apikey-retrieval-role'
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  props = event['ResourceProperties']
                  client = boto3.client('apigateway')

                  # Support lookup by ID (ApiKeyId) or by name (ApiKeyName)
                  if 'ApiKeyId' in props:
                      response = client.get_api_key(apiKey=props['ApiKeyId'], includeValue=True)
                  elif 'ApiKeyName' in props:
                      # List all keys and find by name
                      keys = client.get_api_keys(includeValues=True)['items']
                      matching = [k for k in keys if k['name'] == props['ApiKeyName']]
                      if not matching:
                          raise Exception(f"No API key found with name: {props['ApiKeyName']}")
                      response = matching[0]
                  else:
                      raise Exception('Must provide either ApiKeyId or ApiKeyName')

                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {'ApiKeyValue': response['value']})
              except Exception as e:
                  print(f'ApiKey retrieval error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Tags:
        - Key: Participant
          Value: !Ref ParticipantName

